# Render one gstack commit for Hermes and report what each skill needs at run
# time: interpreters, network, outside tools. Input for deciding what
# horo-gstack can ship to a pip-only, offline install. Publishes nothing.
#
# gstack's own code (the renderer) runs only here, never on a workstation.
name: inventory

on:
  workflow_dispatch:
    inputs:
      gstack_commit:
        description: "garrytan/gstack commit (40-character SHA) to inventory"
        required: true

permissions:
  contents: read

env:
  # A path no install uses: every script a skill runs shows up as this prefix.
  INSTALL_ROOT: /opt/horo-gstack

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2  # gstack's GSTACK_BUN_TESTED

      - name: Check out the gstack commit
        run: |
          [[ "${{ inputs.gstack_commit }}" =~ ^[0-9a-f]{40}$ ]] || { echo "gstack_commit must be a full SHA"; exit 1; }
          git clone --filter=blob:none --no-checkout https://github.com/garrytan/gstack.git gstack
          git -C gstack checkout --quiet "${{ inputs.gstack_commit }}"

      # --ignore-scripts: no postinstall downloads (Playwright browsers and the like).
      - name: Install the renderer's dependencies
        working-directory: gstack
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Render for Hermes
        working-directory: gstack
        run: |
          bun --no-env-file scripts/gen-skill-docs.ts --host hermes \
            --install-root "$INSTALL_ROOT" --out-dir "$GITHUB_WORKSPACE/render"
          n=$(find "$GITHUB_WORKSPACE/render/.hermes/skills" -name SKILL.md | wc -l)
          echo "rendered $n skills"; [ "$n" -gt 0 ]

      - name: Inventory
        run: |
          python3 -I inventory.py gstack render/.hermes/skills "$INSTALL_ROOT" inventory
          cat inventory/inventory.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: inventory-${{ inputs.gstack_commit }}
          path: |
            inventory/
            render/
          if-no-files-found: error
          include-hidden-files: true  # the render lives under render/.hermes/
