# Can gstack's Hermes render run on a machine whose only package sources are a
# pip and an npm mirror, with no other network? The prepare job fetches what
# such mirrors would serve; the offline job installs from that alone inside a
# network namespace with no route out, then runs every skill's preamble with
# bun and without. Publishes nothing.
name: offline

on:
  workflow_dispatch:
    inputs:
      gstack_commit:
        description: "garrytan/gstack commit (40-character SHA) to test"
        required: true

permissions:
  contents: read

env:
  INSTALL_ROOT: /opt/horo-gstack

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Check out the gstack commit
        run: |
          [[ "${{ inputs.gstack_commit }}" =~ ^[0-9a-f]{40}$ ]] || { echo "gstack_commit must be a full SHA"; exit 1; }
          git clone --filter=blob:none --no-checkout https://github.com/garrytan/gstack.git gstack
          git -C gstack checkout --quiet "${{ inputs.gstack_commit }}"

      - name: Render for Hermes
        working-directory: gstack
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun --no-env-file scripts/gen-skill-docs.ts --host hermes \
            --install-root "$INSTALL_ROOT" --out-dir "$GITHUB_WORKSPACE/stage/render"

      # The runtime is the checkout without its dependencies: whether the
      # scripts need gstack's node_modules is part of what this tests.
      - name: Stage the runtime, the npm cache and the wheelhouse
        run: |
          rsync -a --exclude .git --exclude node_modules gstack/ stage/runtime/
          npm cache add bun@1.4.2 @oven/bun-linux-x64@1.4.2 --cache stage/npm-cache
          python3 -m pip download -q horo-next==0.21.5 -d stage/wheelhouse
          tar -C stage -czf stage.tgz .

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage
          path: stage.tgz

  offline:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stage

      - name: Unpack
        run: |
          mkdir stage && tar -C stage -xzf stage.tgz
          sudo mkdir -p "$INSTALL_ROOT" && sudo cp -a stage/runtime/. "$INSTALL_ROOT/"
          ! command -v bun || { echo "bun is already on this runner: $(command -v bun)"; exit 1; }

      # unshare --net: a namespace with only loopback, so every outbound
      # connection fails the way it would on an offline machine.
      - name: Install and run with no network
        run: |
          sudo unshare --net bash -c "ip link set lo up && exec setpriv --reuid=$(id -u) --regid=$(id -g) --init-groups \
            env -i PATH=/usr/local/bin:/usr/bin:/bin LANG=C.UTF-8 bash offline/test.sh stage out"
          cat out/report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: offline-report
          path: out/
