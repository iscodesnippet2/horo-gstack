# Can gstack's browse drive a Google Chrome that is already installed on
# CentOS 8 / 9, with bun from an npm cache and no other network?
#
# browse/dist/browse is a thin client: on Linux it starts
# `bun run browse/src/server.ts`, which drives the browser through Playwright.
# So this tests two clients against the same server and runtime:
#   compiled  bun build --compile, as upstream ships it (linux-x64-baseline)
#   wrapper   a shell script that runs browse/src/cli.ts with bun, which would
#             keep the wheel free of platform binaries
# Rocky Linux 8 stands in for CentOS 8, whose repositories are gone. Containers
# share the runner's kernel, so this covers glibc and Chrome, not CentOS 8's
# 4.18 kernel. Publishes nothing.
name: browse-centos

on:
  workflow_dispatch:
    inputs:
      gstack_commit:
        description: "garrytan/gstack commit (40-character SHA) to test"
        required: true

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Check out the gstack commit
        run: |
          [[ "${{ inputs.gstack_commit }}" =~ ^[0-9a-f]{40}$ ]] || { echo "gstack_commit must be a full SHA"; exit 1; }
          git clone --filter=blob:none --no-checkout https://github.com/garrytan/gstack.git gstack
          git -C gstack checkout --quiet "${{ inputs.gstack_commit }}"

      # --ignore-scripts: Playwright must not fetch its own Chromium; the test
      # uses the Chrome the machine already has. bun applies gstack's
      # playwright-core patch itself.
      - name: Install and build the browse client
        working-directory: gstack
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun build --compile --target=bun-linux-x64-baseline --no-compile-autoload-dotenv \
            --no-compile-autoload-bunfig browse/src/cli.ts --outfile browse/dist/browse
          printf '%s\n' '#!/usr/bin/env bash' \
            '# Runs the browse client from source, with the flags browse uses for its own bun children.' \
            'exec bun --no-env-file --config=/dev/null "$(dirname "$(readlink -f "$0")")/../src/cli.ts" "$@"' \
            > browse/dist/browse-wrapper
          chmod +x browse/dist/browse-wrapper
          file browse/dist/browse

      # The server imports @ngrok/ngrok and @huggingface/transformers only on
      # demand; leaving them out shows whether browse needs them. sharp (and
      # its @img/*-linux-x64 native parts) is needed for screenshots.
      - name: Stage the runtime and the npm cache
        run: |
          {
            echo "## node_modules, largest first"; echo '```'
            du -sh gstack/node_modules/* gstack/node_modules/@*/* 2>/dev/null | sort -rh | head -25
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p stage
          rsync -a --exclude .git \
            --exclude 'node_modules/@huggingface' --exclude 'node_modules/onnxruntime-*' \
            --exclude 'node_modules/@ngrok' \
            --exclude 'node_modules/@anthropic-ai' --exclude 'node_modules/html-to-docx' \
            --exclude 'node_modules/typescript' --exclude 'node_modules/@types' \
            gstack/ stage/runtime/
          echo "Runtime staged: $(du -sh stage/runtime | cut -f1), node_modules $(du -sh stage/runtime/node_modules | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          npm cache add bun@1.4.2 @oven/bun-linux-x64@1.4.2 @oven/bun-linux-x64-baseline@1.4.2 --cache stage/npm-cache
          tar -C stage -czf stage.tgz .

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage
          path: stage.tgz

  centos:
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: el8
            image: docker.io/rockylinux/rockylinux:8
          - name: el9
            image: quay.io/centos/centos:stream9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stage

      # What the target machine already has: Google Chrome, Node.js with npm
      # (for the npm mirror), python3. Installed with network, before the test.
      - name: Build the ${{ matrix.name }} image with Google Chrome
        run: |
          mkdir stage && tar -C stage -xzf stage.tgz
          cat > Dockerfile <<'EOF'
          ARG IMAGE
          FROM ${IMAGE}
          RUN dnf -y module enable nodejs:20 \
           && dnf -y install nodejs npm python3 procps-ng file \
              https://dl.google.com/linux/direct/google-chrome-stable_current_x86_64.rpm \
           && dnf clean all \
           && useradd -m -u 1001 tester
          EOF
          docker build -q --build-arg IMAGE=${{ matrix.image }} -t horo-browse-test .

      # --network none: only loopback. seccomp=unconfined lets Chrome create the
      # user namespace its sandbox needs, as it can on a CentOS host.
      - name: Run browse with no network
        run: |
          mkdir -p out && chmod 777 out
          docker run --rm --network none --security-opt seccomp=unconfined -u tester \
            -v "$PWD/stage:/stage:ro" -v "$PWD/offline:/test:ro" -v "$PWD/out:/out" \
            horo-browse-test bash /test/browse-test.sh /stage /out
          { echo "# ${{ matrix.name }}"; cat out/report.md; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: browse-${{ matrix.name }}
          path: out/
