# Build one gstack commit as horo-gstack and publish it.
#
#   garrytan/gstack@commit  ──render for Hermes + vendor──▶  linux-x64 wheel + SBOM
#   ──▶  verify offline on CentOS 8 and 9 with Google Chrome  ──▶  TestPyPI  ──▶  (approval)  ──▶  PyPI
#
# gstack content is never committed to this repository. Each run checks out the
# commit fresh, so a release is a pure function of (gstack commit, this repo).
#
# Publishing uses PyPI Trusted Publishing: no API token is stored here.
name: release

on:
  workflow_dispatch:
    inputs:
      gstack_commit:
        description: "garrytan/gstack commit (40-character SHA) to package"
        required: true
      post:
        description: "Post-release number when only this packaging changed (blank for none)"
        required: false
        default: ""
      publish:
        description: "Publish after verification (false = build and verify only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.gstack_commit }}-${{ inputs.post }}
  cancel-in-progress: false

env:
  INSTALL_ROOT: /opt/horo-gstack

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2  # gstack's GSTACK_BUN_TESTED

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Check out the gstack commit
        run: |
          [[ "${{ inputs.gstack_commit }}" =~ ^[0-9a-f]{40}$ ]] || { echo "gstack_commit must be a full SHA"; exit 1; }
          git clone --filter=blob:none --no-checkout https://github.com/garrytan/gstack.git gstack
          git -C gstack checkout --quiet "${{ inputs.gstack_commit }}"

      # --ignore-scripts: Playwright must not fetch its own Chromium; browse uses
      # the Chrome already on the machine. bun applies gstack's playwright-core
      # patch itself.
      - name: Install gstack's dependencies and render for Hermes
        working-directory: gstack
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun --no-env-file scripts/gen-skill-docs.ts --host hermes \
            --install-root "$INSTALL_ROOT" --out-dir "$GITHUB_WORKSPACE/render"

      - name: Vendor
        run: python3 -I vendor.py gstack render/.hermes/skills ${{ inputs.post }}

      - id: meta
        run: echo "version=$(python3 -c 'exec(open("src/horo_gstack/_version.py").read()); print(__version__)')" >> "$GITHUB_OUTPUT"

      - name: Build the wheel
        run: |
          uv build --wheel --out-dir build-dist
          mkdir dist && mv build-dist/*.whl dist/
          ls -l dist

      - name: Generate and embed the SBOM (PEP 770)
        run: |
          v="${{ steps.meta.outputs.version }}"
          python3 sbom.py generate horo-gstack.cdx.json
          python3 sbom.py embed "dist/horo_gstack-$v-py3-none-any.whl" horo-gstack.cdx.json "horo-gstack-$v.cdx.json"
          uv run --with 'cyclonedx-python-lib[json-validation]==11.12.0' python -c "
          import sys
          from cyclonedx.schema import SchemaVersion
          from cyclonedx.validation.json import JsonStrictValidator
          v = JsonStrictValidator(SchemaVersion.V1_5)
          for f in sys.argv[1:]:
              err = v.validate_str(open(f).read())
              sys.exit(f'{f}: invalid CycloneDX 1.5: {err}') if err else print(f, 'valid CycloneDX 1.5')
          " horo-gstack.cdx.json "horo-gstack-$v.cdx.json"

      - name: Release notes
        run: |
          python3 - <<'EOF' > release-notes.md
          import json
          up = json.load(open("src/horo_gstack/_vendor/UPSTREAM.json"))
          print(f"gstack {up['version']} from {up['repository']}/tree/{up['commit']}\n")
          print(f"Ships {len(up['skills'])} skills, linux-x64 only (CentOS 8 and later).\n")
          print("Left out:\n")
          for name, why in sorted(up["excluded"].items()):
              print(f"- `{name}`: {why}")
          print("\nnpm packages in the runtime, for browse:\n")
          for p in up["npm"]:
              print(f"- {p['name']} {p['version']} ({p['license']})")
          EOF
          { cat release-notes.md; echo; ls -l dist; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            dist/
            release-notes.md
            horo-gstack-${{ steps.meta.outputs.version }}.cdx.json
          if-no-files-found: error

  # Rocky Linux 8 stands in for CentOS 8, whose repositories are gone.
  # Containers share the runner's kernel: CentOS 8's 4.18 is not covered.
  verify:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: el8
            image: docker.io/rockylinux/rockylinux:8
          - name: el9
            image: quay.io/centos/centos:stream9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release

      # What the target machine has: Python 3.12, Node.js with npm, git and
      # Google Chrome. Installed with network, before the test.
      - name: Build the ${{ matrix.name }} image
        run: |
          cat > Dockerfile <<'EOF'
          ARG IMAGE
          FROM ${IMAGE}
          RUN dnf -y module enable nodejs:20 \
           && dnf -y install python3.12 python3.12-pip nodejs npm git procps-ng findutils \
              https://dl.google.com/linux/direct/google-chrome-stable_current_x86_64.rpm \
           && dnf clean all \
           && useradd -m -u 1001 tester
          EOF
          docker build -q --build-arg IMAGE=${{ matrix.image }} -t horo-gstack-test .

      # What the pip and npm mirrors would serve, fetched on this platform.
      - name: Fill the wheelhouse and the npm cache
        run: |
          mkdir -p stage && cp release/dist/*.whl stage/ && chmod -R 777 stage
          docker run --rm -u tester -v "$PWD/stage:/stage" horo-gstack-test bash -c '
            python3.12 -m pip download -q horo-next==0.21.5 -d /stage/wheelhouse &&
            npm cache add bun@1.4.2 @oven/bun-linux-x64@1.4.2 @oven/bun-linux-x64-baseline@1.4.2 --cache /stage/npm-cache'

      # --network none: only loopback. seccomp=unconfined lets Chrome create the
      # user namespace its sandbox needs, as it can on a CentOS host.
      - name: Install and run with no network
        run: |
          mkdir -p out && chmod 777 out
          rc=0
          docker run --rm --network none --security-opt seccomp=unconfined -u tester \
            -v "$PWD/stage:/stage:ro" -v "$PWD/offline:/test:ro" -v "$PWD/out:/out" \
            horo-gstack-test bash /test/verify-wheel.sh /stage /out || rc=$?
          { echo "# ${{ matrix.name }}"; cat out/report.md; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: verify-${{ matrix.name }}
          path: out/

  testpypi:
    if: inputs.publish
    needs: verify
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
      # skip-existing: a re-run after a rejected PyPI step must reach that step again.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          skip-existing: true

  # The `pypi` environment requires a reviewer (repository settings). A version
  # uploaded to PyPI can never be uploaded again, even if deleted.
  pypi:
    if: inputs.publish
    needs: [build, testpypi]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ needs.build.outputs.version }}"
          gh release create "v$v" --repo "${{ github.repository }}" \
            --title "horo-gstack $v (gstack @ ${{ inputs.gstack_commit }})" \
            --notes-file release-notes.md dist/*.whl "horo-gstack-$v.cdx.json"
